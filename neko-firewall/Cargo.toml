[package]
name = "neko-firewall"
version = "1.1.0"
edition = "2021"

[[bin]]
name = "neko-firewall"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
aya = "0.13"
aya-log = "0.2"
bytes = "1"
clap = { workspace = true }
env_logger = "0.11"
log = { workspace = true }
ipnetwork = "0.21"
maxminddb = "0.27"
neko-common = { path = "../neko-common", features = ["user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { workspace = true }
chacha20poly1305 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
